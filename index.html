
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris (WASD + Enter)</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #00f0f0;
            text-shadow: 0 0 10px rgba(0, 240, 240, 0.5);
        }

        .game-container {
            display: flex;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
        }

        canvas {
            border: 2px solid #333;
            background: #000;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-left: 20px;
            width: 150px;
        }

        .info-box {
            background: #222;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            text-align: center;
        }

        .info-box h2 {
            font-size: 0.9rem;
            margin: 0 0 5px 0;
            color: #888;
            text-transform: uppercase;
        }

        .info-box span {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .btn {
            background: #00f0f0;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: #00bcbc;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #777;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>TETRIS</h1>
    <div class="game-container">
        <canvas id="tetris" width="300" height="600"></canvas>
        <div class="side-panel">
            <div>
                <div class="info-box" style="margin-bottom: 15px;">
                    <h2>Puntuación</h2>
                    <span id="score">0</span>
                </div>
                <div class="info-box">
                    <h2>Nivel</h2>
                    <span id="level">1</span>
                </div>
            </div>
            <button class="btn" id="start-btn">Jugar / Pausa</button>
            <div class="controls-hint">
                <strong>Controles:</strong><br>
                A / D : Mover<br>
                S : Bajar<br>
                <strong>Enter : Rotar</strong><br>
                Espacio : Caída / Jugar<br>
                P : Pausa
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const startBtn = document.getElementById('start-btn');

        context.scale(30, 30);

        const arena = createMatrix(10, 20);

        const colors = [
            null,
            '#FF0D72', // T - Magenta
            '#0DC2FF', // I - Cyan
            '#0DFF72', // S - Verde
            '#F538FF', // Z - Morado/Rosa
            '#FF8E0D', // L - Naranja
            '#FFE138', // O - Amarillo
            '#3877FF'  // J - Azul
        ];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [
                    [0, 1, 0],
                    [1, 1, 1],
                    [0, 0, 0],
                ];
            } else if (type === 'I') {
                return [
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 3, 3],
                    [3, 3, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [4, 4, 0],
                    [0, 4, 4],
                    [0, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 5, 0],
                    [0, 5, 0],
                    [0, 5, 5],
                ];
            } else if (type === 'O') {
                return [
                    [6, 6],
                    [6, 6],
                ];
            } else if (type === 'J') {
                return [
                    [0, 7, 0],
                    [0, 7, 0],
                    [7, 7, 0],
                ];
            }
        }

        const player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            score: 0,
            level: 1,
        };

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 100;
                rowCount *= 2;
            }
            
            player.level = Math.floor(player.score / 500) + 1;
            scoreElement.innerText = player.score;
            levelElement.innerText = player.level;
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.level = 1;
                scoreElement.innerText = player.score;
                levelElement.innerText = player.level;
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;

        function update(time = 0) {
            if (isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            let currentInterval = Math.max(100, dropInterval - (player.level - 1) * 100);

            if (dropCounter > currentInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, { x: 0, y: 0 });
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        context.strokeStyle = 'rgba(255,255,255,0.2)';
                        context.lineWidth = 0.05;
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function togglePlay() {
            if (isPaused) {
                isPaused = false;
                if (player.matrix === null) {
                    playerReset();
                }
                lastTime = performance.now();
                update();
                startBtn.innerText = "Pausar";
            } else {
                isPaused = true;
                startBtn.innerText = "Reanudar";
            }
        }

        // Control de teclado con WASD + Enter + Espacio
        document.addEventListener('keydown', event => {
            const key = event.key.toLowerCase();

            // Prevenir scroll por defecto con espacio, enter o teclas de juego
            if ([' ', 'enter', 'a', 's', 'd'].includes(key) || [13, 32, 37, 38, 39, 40].includes(event.keyCode)) {
                event.preventDefault();
            }

            // Barra Espaciadora para iniciar o caída rápida
            if (key === ' ' || event.keyCode === 32) {
                if (isPaused) {
                    togglePlay();
                } else {
                    while (!collide(arena, player)) {
                        player.pos.y++;
                    }
                    player.pos.y--;
                    merge(arena, player);
                    playerReset();
                    arenaSweep();
                    dropCounter = 0;
                }
                return;
            } 
            
            // Tecla Enter para rotar la pieza
            if (event.keyCode === 13 || key === 'enter') {
                if (!isPaused) {
                    playerRotate(1);
                }
                return;
            }

            // Tecla 'P' para pausar
            if (key === 'p') {
                togglePlay();
                return;
            }

            if (isPaused) return;

            if (key === 'a') { // Izquierda
                playerMove(-1);
            } else if (key === 'd') { // Derecha
                playerMove(1);
            } else if (key === 's') { // Bajar
                playerDrop();
            }
        });

        startBtn.addEventListener('click', togglePlay);

        draw();
    </script>
</body>
</html>
